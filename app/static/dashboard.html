<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HotBoat ETL — Estado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: .5px; }
    header h1 span { color: #f97316; }

    #refresh-info {
      font-size: .8rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #refresh-info .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }

    #error-banner {
      display: none;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      color: #991b1b;
      font-size: .9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      cursor: pointer;
      transition: box-shadow .15s, transform .15s;
      border-left: 4px solid #e2e8f0;
      position: relative;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); transform: translateY(-1px); }
    .card.success { border-left-color: #22c55e; }
    .card.error   { border-left-color: #ef4444; }
    .card.running { border-left-color: #f59e0b; }
    .card.never   { border-left-color: #cbd5e1; }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .card-title  { font-weight: 600; font-size: .95rem; color: #1e293b; }

    .badge {
      font-size: .72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: .4px;
      white-space: nowrap;
    }
    .badge.success { background: #dcfce7; color: #15803d; }
    .badge.error   { background: #fee2e2; color: #b91c1c; }
    .badge.running { background: #fef9c3; color: #92400e; }
    .badge.never   { background: #f1f5f9; color: #64748b; }

    .card-body { margin-top: 14px; }
    .meta-row  { display: flex; gap: 6px; margin-top: 6px; font-size: .82rem; color: #64748b; }
    .meta-label{ font-weight: 500; color: #94a3b8; }

    .error-msg {
      margin-top: 12px;
      background: #fff5f5;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: .78rem;
      color: #b91c1c;
      font-family: monospace;
      word-break: break-word;
      max-height: 80px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 28px;
      width: min(700px, 95vw);
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 18px;
      color: #1e293b;
    }
    .modal-close {
      float: right;
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: #94a3b8;
      line-height: 1;
      margin-top: -4px;
    }
    .modal-close:hover { color: #1e293b; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .83rem;
    }
    th {
      text-align: left;
      padding: 8px 10px;
      background: #f8fafc;
      color: #64748b;
      font-weight: 600;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
    }
    td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    .td-error {
      color: #b91c1c;
      font-family: monospace;
      font-size: .76rem;
      max-width: 260px;
      word-break: break-word;
    }

    #loading {
      text-align: center;
      padding: 60px;
      color: #94a3b8;
      font-size: .95rem;
    }
  </style>
</head>
<body>

<header>
  <h1>HotBoat <span>ETL</span> — Estado de extracciones</h1>
  <div id="refresh-info">
    <div class="dot"></div>
    <span id="countdown">Actualizando en 30s</span>
  </div>
</header>

<main>
  <div id="error-banner"></div>
  <div id="loading">Cargando...</div>
  <div class="grid" id="grid" style="display:none"></div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">×</button>
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
  const REFRESH_INTERVAL = 30;
  let countdown = REFRESH_INTERVAL;
  let timer;

  function relativeTime(isoStr) {
    if (!isoStr) return '—';
    const diff = Math.floor((Date.now() - new Date(isoStr)) / 1000);
    if (diff < 60)  return `hace ${diff}s`;
    if (diff < 3600) return `hace ${Math.floor(diff/60)}m`;
    if (diff < 86400) return `hace ${Math.floor(diff/3600)}h ${Math.floor((diff%3600)/60)}m`;
    return `hace ${Math.floor(diff/86400)}d`;
  }

  function duration(startIso, endIso) {
    if (!startIso || !endIso) return '—';
    const s = Math.floor((new Date(endIso) - new Date(startIso)) / 1000);
    if (s < 60) return `${s}s`;
    return `${Math.floor(s/60)}m ${s%60}s`;
  }

  function statusClass(status) {
    if (!status) return 'never';
    if (status === 'success') return 'success';
    if (status === 'error')   return 'error';
    return 'running';
  }

  function badgeLabel(status) {
    if (!status)             return 'Sin datos';
    if (status === 'success') return 'OK';
    if (status === 'error')   return 'Error';
    return status;
  }

  function renderCard(job) {
    const sc   = statusClass(job.status);
    const rows = job.row_count != null ? `<div class="meta-row"><span class="meta-label">Filas</span> ${job.row_count.toLocaleString()}</div>` : '';
    const dur  = `<div class="meta-row"><span class="meta-label">Duración</span> ${duration(job.started_at, job.finished_at)}</div>`;
    const last = `<div class="meta-row"><span class="meta-label">Última vez</span> ${relativeTime(job.started_at)}</div>`;
    const err  = (sc === 'error' && job.error)
      ? `<div class="error-msg">${escHtml(job.error)}</div>` : '';

    return `
      <div class="card ${sc}" data-job="${escHtml(job.job_name)}" data-label="${escHtml(job.label)}">
        <div class="card-header">
          <div class="card-title">${escHtml(job.label)}</div>
          <span class="badge ${sc}">${badgeLabel(job.status)}</span>
        </div>
        <div class="card-body">
          ${last}${rows}${dur}${err}
        </div>
      </div>`;
  }

  function escHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadStatus() {
    try {
      const res = await fetch('/api/status');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-banner').style.display = 'none';
      const grid = document.getElementById('grid');
      grid.style.display = 'grid';
      grid.innerHTML = data.jobs.map(renderCard).join('');
      grid.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => openHistory(
          card.dataset.job, card.dataset.label
        ));
      });
    } catch(e) {
      const banner = document.getElementById('error-banner');
      banner.style.display = 'block';
      banner.textContent = `Error cargando datos: ${e.message}`;
    }
  }

  async function openHistory(jobName, label) {
    const overlay = document.getElementById('modal-overlay');
    document.getElementById('modal-title').textContent = label;
    document.getElementById('modal-body').innerHTML = '<p style="color:#94a3b8;font-size:.85rem">Cargando historial...</p>';
    overlay.classList.add('open');

    try {
      const res = await fetch(`/api/history/${encodeURIComponent(jobName)}`);
      const data = await res.json();
      if (!data.runs.length) {
        document.getElementById('modal-body').innerHTML = '<p style="color:#94a3b8;font-size:.85rem">Sin ejecuciones registradas.</p>';
        return;
      }
      const rows = data.runs.map(r => {
        const sc = statusClass(r.status);
        const errCell = r.error
          ? `<td class="td-error">${escHtml(r.error.substring(0, 200))}</td>`
          : '<td style="color:#94a3b8">—</td>';
        return `<tr>
          <td>${r.started_at ? new Date(r.started_at).toLocaleString('es-CL') : '—'}</td>
          <td><span class="badge ${sc}">${badgeLabel(r.status)}</span></td>
          <td>${duration(r.started_at, r.finished_at)}</td>
          <td>${r.row_count != null ? r.row_count.toLocaleString() : '—'}</td>
          ${errCell}
        </tr>`;
      }).join('');
      document.getElementById('modal-body').innerHTML = `
        <table>
          <thead><tr>
            <th>Fecha</th><th>Estado</th><th>Duración</th><th>Filas</th><th>Error</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch(e) {
      document.getElementById('modal-body').innerHTML = `<p style="color:#b91c1c">Error: ${e.message}</p>`;
    }
  }

  document.getElementById('modal-close').addEventListener('click', () => {
    document.getElementById('modal-overlay').classList.remove('open');
  });
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget)
      document.getElementById('modal-overlay').classList.remove('open');
  });

  function startCountdown() {
    clearInterval(timer);
    countdown = REFRESH_INTERVAL;
    timer = setInterval(() => {
      countdown--;
      document.getElementById('countdown').textContent = `Actualizando en ${countdown}s`;
      if (countdown <= 0) {
        loadStatus();
        countdown = REFRESH_INTERVAL;
      }
    }, 1000);
  }

  loadStatus();
  startCountdown();
</script>
</body>
</html>
